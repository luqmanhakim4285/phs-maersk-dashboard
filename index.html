<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHS Maersk Incentive - Alongside Vessel</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg-void: #060b12;
  --bg-panel: #0e1a27;
  --bg-raised: #142639;
  --line: rgba(234,242,248,0.09);
  --line-strong: rgba(234,242,248,0.18);
  --ink: #eaf2f8;
  --ink-muted: #7d94a8;
  --ink-faint: #47617a;
  --teal: #27d6a8;
  --teal-dim: rgba(39,214,168,0.14);
  --amber: #f5a623;
  --amber-dim: rgba(245,166,35,0.14);
  --red: #ff6161;
  --red-dim: rgba(255,97,97,0.14);
  --gold: #e8b84b;
  --silver: #9fb2c4;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body{
  background:
    radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(39,214,168,0.06), transparent 60%),
    radial-gradient(ellipse 900px 500px at 100% 0%, rgba(245,166,35,0.05), transparent 55%),
    var(--bg-void);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  padding: 28px 32px 60px;
}

header{
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 20px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 26px;
}

.brand{
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark{
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: linear-gradient(160deg, var(--bg-raised), var(--bg-panel));
  border: 1px solid var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-mark svg{
  width: 20px;
  height: 20px;
}

.brand-name{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.02em;
}

.header-actions{
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn{
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 8px 14px;
  cursor: pointer;
  transition: all .15s ease;
  white-space: nowrap;
}

.btn:hover{
  color: var(--ink);
  border-color: var(--teal);
}

.btn.ghost{
  background: transparent;
}

.clock-block{
  text-align: right;
}

.clock{
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.clock-label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--ink-muted);
  text-transform: uppercase;
  margin-top: 2px;
}

.data-status{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 4px;
  text-align: right;
}

.kpi-row{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}

.kpi{
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink-faint);
  border-radius: 6px;
  padding: 14px 16px;
}

.kpi.teal{
  border-left-color: var(--teal);
}

.kpi.amber{
  border-left-color: var(--amber);
}

.kpi.red{
  border-left-color: var(--red);
}

.kpi-value{
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.kpi-label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 4px;
}

.filter-row{
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.filter-label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-right: 4px;
}

.chip{
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.05em;
  color: var(--ink-muted);
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all .15s ease;
}

.chip:hover{
  border-color: var(--line-strong);
  color: var(--ink);
}

.chip.active{
  background: var(--teal-dim);
  border-color: var(--teal);
  color: var(--teal);
}

.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.card{
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color .15s ease;
}

.card:hover{
  border-color: var(--line-strong);
}

.card-top{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.ref-tag{
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
}

.badges{
  display: flex;
  gap: 6px;
  align-items: center;
}

.badge{
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  color: var(--ink-muted);
}

.badge.tier1{
  color: var(--gold);
  border-color: rgba(232,184,75,0.4);
  background: rgba(232,184,75,0.08);
}

.badge.tier2{
  color: var(--silver);
  border-color: rgba(159,178,196,0.35);
  background: rgba(159,178,196,0.06);
}

.beacon{
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.beacon.ahead{
  background: var(--teal);
  box-shadow: 0 0 8px 1px rgba(39,214,168,0.6);
  animation: pulse 2.4s ease-in-out infinite;
}

.beacon.risk{
  background: var(--amber);
  box-shadow: 0 0 8px 1px rgba(245,166,35,0.55);
  animation: pulse 2.4s ease-in-out infinite;
}

.beacon.behind{
  background: var(--red);
  box-shadow: 0 0 8px 1px rgba(255,97,97,0.55);
  animation: pulse 1.4s ease-in-out infinite;
}

@keyframes pulse{
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.vessel-name{
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.moves-line{
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-muted);
}

.moves-line b{
  color: var(--ink);
  font-weight: 500;
}

.gauge-block{
  margin-top: 2px;
}

.gauge-labels{
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 5px;
}

.gauge-labels .val{
  color: var(--ink);
  font-size: 12px;
  letter-spacing: normal;
  text-transform: none;
}

.gauge-track{
  height: 7px;
  background: rgba(234,242,248,0.06);
  border-radius: 4px;
  overflow: hidden;
}

.gauge-fill{
  height: 100%;
  border-radius: 4px;
}

.stat-pair{
  display: flex;
  gap: 10px;
}

.stat-box{
  flex: 1;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
}

.stat-box .lbl{
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.stat-box .num{
  font-family: var(--font-mono);
  font-size: 15px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.ph-line{
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-top: 4px;
}

.sub-lbl{
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.ph-sep{
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-faint);
  padding-bottom: 1px;
}

.delta-pill{
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
  margin-top: 3px;
}

.delta-pill.ahead{
  background: var(--teal-dim);
  color: var(--teal);
}

.delta-pill.risk{
  background: var(--amber-dim);
  color: var(--amber);
}

.delta-pill.behind{
  background: var(--red-dim);
  color: var(--red);
}

.card-foot{
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.foot-row{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--font-mono);
  font-size: 11px;
}

.foot-row .k{
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-size: 9.5px;
}

.foot-row .v{
  color: var(--ink);
}

.foot-row .v.overdue{
  color: var(--red);
}

.foot-row .v.ok{
  color: var(--teal);
}

footer{
  margin-top: 34px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

@media (max-width: 720px){
  .kpi-row{
    grid-template-columns: repeat(2, 1fr);
  }

  body{
    padding: 20px 16px 40px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 17L5 21H19L21 17" stroke="#27D6A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 17V9H18V17" stroke="#EAF2F8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 9V3" stroke="#EAF2F8" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 3L16 6" stroke="#F5A623" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>

    <div>
      <div class="brand-name">PHS MAERSK INCENTIVE - ALONGSIDE VESSEL</div>
    </div>
  </div>

  <div class="header-actions">
    <button class="btn ghost" id="templateBtn">Download Template</button>
  </div>

  <div class="clock-block">
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-label" id="clockDate">LOCAL TIME</div>
    <div class="data-status" id="dataStatus"></div>
  </div>
</header>

<div class="kpi-row" id="kpiRow"></div>

<div class="filter-row" id="filterRow">
  <span class="filter-label">Filter</span>
</div>

<div class="grid" id="grid"></div>

<footer>
  Berth data reflects most recent report · % PHS = variance vs. port-hour target positive = ahead of target hours · Sorted by completion, least complete first
</footer>

<script>
const DATA_URL = './PHS_Data.json';

const SAMPLE_VESSELS = [
  {
    ref: 'U1B632S',
    name: 'MAERSK BISCAYNE',
    category: 'MAINLINER',
    etc: '7/8/2026 13:28',
    moves: 2423,
    movesRange: 'V 2001-2500',
    portHours: 25.48,
    phTarget: 24.11,
    phsPct: -5.7,
    tier: 1,
    completedPct: 97,
    incentiveEtc: '7/8/2026 7:17',
    minIncentive: '20%'
  }
];

const FIELD_MAP = [
  { key: 'ref', label: 'visit_ref' },
  { key: 'name', label: 'vessel_name' },
  { key: 'category', label: 'Category' },
  { key: 'etc', label: 'ETC' },
  { key: 'moves', label: 'Total Moves' },
  { key: 'movesRange', label: 'Moves Range' },
  { key: 'portHours', label: 'Port hours' },
  { key: 'phTarget', label: 'PH Target' },
  { key: 'phsPct', label: '% PHS' },
  { key: 'tier', label: 'Tier Achieved' },
  { key: 'completedPct', label: '% Completed' },
  { key: 'incentiveEtc', label: 'ETC to Achieve Incentive (20%)' },
  { key: 'minIncentive', label: 'Target Incentive' }
];

let VESSELS = [];
let activeCategory = 'ALL';
let lastUpdatedLabel = 'LOADING DATA';

function getValue(row, key, label){
  if (row[key] !== undefined) return row[key];
  if (row[label] !== undefined) return row[label];

  const matchedKey = Object.keys(row).find(k =>
    k.toLowerCase().trim() === key.toLowerCase().trim() ||
    k.toLowerCase().trim() === label.toLowerCase().trim()
  );

  return matchedKey ? row[matchedKey] : '';
}

function toNumber(value, fallback = 0){
  if (value === null || value === undefined || value === '') return fallback;

  const cleaned = String(value)
    .replace(/,/g, '')
    .replace(/%/g, '')
    .trim();

  const n = Number(cleaned);
  return isFinite(n) ? n : fallback;
}

function toPercent(value){
  const n = toNumber(value);
  return Math.abs(n) <= 1 ? n * 100 : n;
}

function toIncentiveText(value){
  if (value === null || value === undefined || value === '') return '-';
  if (String(value).includes('%')) return String(value);

  const n = Number(value);
  if (!isFinite(n)) return String(value);

  const pct = Math.abs(n) <= 1 ? n * 100 : n;
  return (Math.round(pct * 10) / 10).toString().replace(/\.0$/, '') + '%';
}

function normalizeVesselData(rows){
  return rows.map(row => {
    const obj = {};

    FIELD_MAP.forEach(field => {
      obj[field.key] = getValue(row, field.key, field.label);
    });

    return {
      ref: obj.ref || '',
      name: obj.name || '',
      category: obj.category || '',
      etc: obj.etc || '',
      moves: toNumber(obj.moves),
      movesRange: obj.movesRange || '',
      portHours: toNumber(obj.portHours),
      phTarget: toNumber(obj.phTarget),
      phsPct: toPercent(obj.phsPct),
      tier: toNumber(obj.tier),
      completedPct: toPercent(obj.completedPct),
      incentiveEtc: obj.incentiveEtc || '',
      minIncentive: toIncentiveText(obj.minIncentive)
    };
  });
}

async function fetchJson(url){
  const response = await fetch(url, {
    cache: 'no-store',
    headers: {
      'Accept': 'application/json'
    }
  });

  if (!response.ok){
    throw new Error('Failed to load JSON file: ' + url + ' | Status: ' + response.status);
  }

  return await response.json();
}

async function loadDataFromJson(){
  try {
    const data = await fetchJson(DATA_URL);
    const rows = Array.isArray(data) ? data : data.vessels;

    if (!Array.isArray(rows) || rows.length === 0){
      throw new Error('JSON file does not contain vessel rows.');
    }

    VESSELS = normalizeVesselData(rows);
    activeCategory = 'ALL';

    lastUpdatedLabel =
  'AUTO REFRESH ' +
  new Date().toLocaleString('en-GB', { hour12:false });

renderAll();
}
catch(err){
    console.error(err);

    VESSELS = SAMPLE_VESSELS;

    lastUpdatedLabel = 'USING SAMPLE DATA';

    renderAll();
}
}

  function status(phsPct){
  if (phsPct >= 20) return 'ahead';
  if (phsPct >= 0) return 'risk';
  return 'behind';
}

function statusColorVar(s){
  return s === 'ahead'
      ? 'var(--teal)'
      : s === 'risk'
      ? 'var(--amber)'
      : 'var(--red)';
}

  function tickClock(){
  const now = new Date();

  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-GB',{hour12:false});

  document.getElementById('clockDate').textContent =
    now.toLocaleDateString('en-GB',{
      weekday:'short',
      year:'numeric',
      month:'short',
      day:'numeric'
    }).toUpperCase();
}

function renderDataStatus(){
  document.getElementById('dataStatus').textContent =
      lastUpdatedLabel;
}

function renderAll(){
  renderKPIs();
  renderFilters();
  renderGrid();
  renderDataStatus();
}

tickClock();
loadDataFromJson();

setInterval(tickClock,1000);
setInterval(loadDataFromJson,300000);
